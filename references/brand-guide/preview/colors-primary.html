<!DOCTYPE html><html><head><meta charset="utf-8"><title>Colors — Primary Palette</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: var(--bg); }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
  .swatch { border-radius: var(--radius-lg); overflow: hidden; border: 1px solid var(--border); background: var(--bg-elevated); }
  .swatch .chip { height: 88px; }
  .swatch .meta { padding: 10px 12px; }
  .swatch .name { font-size: 13px; font-weight: 600; color: var(--fg-strong); font-family: var(--font-body); }
  .swatch .hex { font-size: 11px; color: var(--fg-muted); margin-top: 2px; letter-spacing: 0.04em; }
</style></head><body>
<div class="grid">
  <div class="swatch"><div class="chip" style="background:#013121"></div><div class="meta"><div class="name">Dark Green</div><div class="hex">#013121</div></div></div>
  <div class="swatch"><div class="chip" style="background:#1C6E42"></div><div class="meta"><div class="name">Dark Spring Green</div><div class="hex">#1C6E42</div></div></div>
  <div class="swatch"><div class="chip" style="background:#32312E"></div><div class="meta"><div class="name">Jet</div><div class="hex">#32312E</div></div></div>
  <div class="swatch"><div class="chip" style="background:#F8F7F5;border-bottom:1px solid var(--border)"></div><div class="meta"><div class="name">Seasalt</div><div class="hex">#F8F7F5</div></div></div>
  <div class="swatch"><div class="chip" style="background:#FFFFFF;border-bottom:1px solid var(--border)"></div><div class="meta"><div class="name">White</div><div class="hex">#FFFFFF</div></div></div>
</div>
</body></html>

<!DOCTYPE html><html><head><meta charset="utf-8"><title>Colors — Sage Cascade</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: var(--bg); }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .swatch { border-radius: var(--radius-lg); overflow: hidden; border: 1px solid var(--border); background: var(--bg-elevated); }
  .swatch .chip { height: 88px; }
  .swatch .meta { padding: 10px 12px; }
  .swatch .name { font-size: 13px; font-weight: 600; color: var(--fg-strong); font-family: var(--font-body); }
  .swatch .hex { font-size: 11px; color: var(--fg-muted); margin-top: 2px; letter-spacing: 0.04em; }
  .swatch .role { font-size: 11px; color: var(--fg-muted); margin-top: 6px; font-style: italic; }
</style></head><body>
<div class="grid">
  <div class="swatch"><div class="chip" style="background:#1C6E42"></div><div class="meta"><div class="name">Dark Spring Green</div><div class="hex">#1C6E42</div><div class="role">action</div></div></div>
  <div class="swatch"><div class="chip" style="background:#498B68"></div><div class="meta"><div class="name">Sea Green</div><div class="hex">#498B68</div><div class="role">hover</div></div></div>
  <div class="swatch"><div class="chip" style="background:#84C2A1"></div><div class="meta"><div class="name">Cambridge Blue</div><div class="hex">#84C2A1</div><div class="role">soft accent</div></div></div>
  <div class="swatch"><div class="chip" style="background:#9DD9B9"></div><div class="meta"><div class="name">Celadon</div><div class="hex">#9DD9B9</div><div class="role">success</div></div></div>
</div>
</body></html>

<!DOCTYPE html><html><head><meta charset="utf-8"><title>Colors — Mad Men Gold &amp; Warm</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: var(--bg); }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .swatch { border-radius: var(--radius-lg); overflow: hidden; border: 1px solid var(--border); background: var(--bg-elevated); }
  .swatch .chip { height: 70px; }
  .swatch .meta { padding: 10px 12px; }
  .swatch .name { font-size: 13px; font-weight: 600; color: var(--fg-strong); font-family: var(--font-body); }
  .swatch .hex { font-size: 11px; color: var(--fg-muted); margin-top: 2px; letter-spacing: 0.04em; }
  .rule-row { margin-top: 18px; display: flex; align-items: center; gap: 12px; }
  .rule-row .label { font: 700 11px var(--font-body); text-transform: uppercase; letter-spacing: var(--tracking-widest); color: var(--fg-gold); white-space: nowrap; }
  .rule-row hr.gold-rule { flex: 1; }
</style></head><body>
<div class="grid">
  <div class="swatch"><div class="chip" style="background:#C4A265"></div><div class="meta"><div class="name">Gold</div><div class="hex">#C4A265</div></div></div>
  <div class="swatch"><div class="chip" style="background:#D4BA85"></div><div class="meta"><div class="name">Gold Light</div><div class="hex">#D4BA85</div></div></div>
  <div class="swatch"><div class="chip" style="background:#FAF8F3;border-bottom:1px solid var(--border)"></div><div class="meta"><div class="name">Cream</div><div class="hex">#FAF8F3</div></div></div>
  <div class="swatch"><div class="chip" style="background:#E8E0D0"></div><div class="meta"><div class="name">Warm</div><div class="hex">#E8E0D0</div></div></div>
</div>
<div class="rule-row"><span class="label">The Gold Rule</span><hr class="gold-rule"></div>
</body></html>

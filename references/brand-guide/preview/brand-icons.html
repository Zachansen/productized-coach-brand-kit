<!DOCTYPE html><html><head><meta charset="utf-8"><title>Brand — Iconography</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: var(--bg); font-family: var(--font-body); }

  .row { display: grid; grid-template-columns: repeat(8, 1fr); gap: 14px; align-items: center; justify-items: center; }
  .icon { color: var(--accent); }
  .icon.gold { color: var(--fg-gold); }
  .icon.muted { color: var(--fg-muted); }
  .lbl { font-size: 10px; color: var(--fg-muted); margin-top: 4px; letter-spacing: 0.04em; }
  .item { text-align: center; }
  .src { margin-top: 16px; font-size: 11px; color: var(--fg-muted); }
</style></head><body>

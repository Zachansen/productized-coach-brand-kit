<!DOCTYPE html><html><head><meta charset="utf-8"><title>Type — Heading Scale</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px 32px; background: var(--bg); }
  .row { display: grid; grid-template-columns: 90px 1fr; align-items: baseline; gap: 16px; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .row:last-child { border-bottom: 0; }
  .tag { font-family: var(--font-body); font-size: 11px; color: var(--fg-muted); letter-spacing: 0.06em; text-transform: uppercase; }
</style></head><body>
<div class="row"><div class="tag">H1 · 36/700</div><h1 style="font-size:36px">What are we building today?</h1></div>
<div class="row"><div class="tag">H2 · 30/700</div><h2 style="font-size:30px">Your Tools</h2></div>
<div class="row"><div class="tag">H3 · 24/700</div><h3 style="font-size:24px">North Star Promise</h3></div>
<div class="row"><div class="tag">H4 · 18/700</div><h4 style="font-size:18px">Stop the scroll</h4></div>
</body></html>
